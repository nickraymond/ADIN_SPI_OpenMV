<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S18 Camera Bench</title>
<!--
  Layout, CSS and the feasibility model are carried from the mockup Nick
  approved on 2026-08-16 (docs/mockups/s18_bench_mockup.html). The mockup's
  simulation is NOT carried: no embedded reef photo, no synthetic scene, no
  client-side JPEG encoder, no simulated ledger. Every number on this page
  comes from the control socket, and the live view is the frozen S3 stream
  server's own /stream.

  Gallery, compare view and the RGB+luma histograms are S18 bite C2; their
  CSS is kept below so that bite is pure addition.
-->
<style>
  :root {
    --bg: #131519; --panel: #1c1f25; --panel-2: #23272e;
    --line: #2f343d; --line-soft: #262b33;
    --fg: #e7eaee; --fg-dim: #99a1ac; --fg-faint: #6b737e;
    --accent: #4a9eff; --ok: #45d483; --warn: #e9b93c; --danger: #f0605a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  .spacer { flex: 1; }

  header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  h1 span { color: var(--fg-faint); font-weight: 400; }
  .chain { display: flex; align-items: center; gap: 8px; font: 11px var(--mono); }
  .node { padding: 3px 9px; border: 1px solid #2c5c3e; border-radius: 4px;
          background: var(--panel-2); color: var(--ok); }
  .hop { color: var(--fg-faint); }
  .heartbeat { font: 11px var(--mono); color: var(--fg-faint); }
  .heartbeat.down { color: var(--danger); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
         background: var(--ok); margin-right:6px; vertical-align:1px; }
  .heartbeat.down .dot { background: var(--danger); }

  .grid { display: grid; grid-template-columns: 300px minmax(0,1fr) 350px;
          gap: 1px; background: var(--line-soft); }
  /* Compare view (bite C2): the right column all describes the LIVE frame,
     so it is stale next to two stored captures. Drop it and give the width
     to the comparison. */
  .grid.cmp { grid-template-columns: 300px minmax(0,1fr); }
  .col { background: var(--bg); padding: 14px; min-width: 0; }
  @media (max-width: 1180px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; margin-bottom: 12px; }
  .panel > h2 { margin:0; padding:9px 12px; font-size:11px; font-weight:600;
                text-transform:uppercase; letter-spacing:.08em; color:var(--fg-dim);
                border-bottom:1px solid var(--line-soft); }
  .panel > .body { padding: 12px; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field > label { display:flex; justify-content:space-between; align-items:baseline;
                   font-size:11px; color:var(--fg-dim); margin-bottom:6px;
                   text-transform:uppercase; letter-spacing:.05em; }
  .field > label .val { font: 12px var(--mono); color: var(--fg); letter-spacing:0; }

  .seg { display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .seg button { flex:1; background:var(--panel-2); border:0; color:var(--fg-dim);
                padding:7px 4px; font:12px var(--mono); cursor:pointer;
                border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#08131f; font-weight:600; }
  .seg button:disabled { opacity:.3; cursor:not-allowed; text-decoration:line-through; }
  .seghint { font:10px var(--mono); color:var(--fg-faint); margin-top:5px; }
  .seghint.active { color: var(--warn); }

  input[type=range] { width:100%; accent-color: var(--accent); }
  input[type=number] { width:100%; background:var(--panel-2); border:1px solid var(--line);
                       color:var(--fg); border-radius:4px; padding:6px 8px; font:12px var(--mono); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button.act { background:var(--panel-2); border:1px solid var(--line); color:var(--fg);
               border-radius:5px; padding:9px 6px; font:12px var(--sans); font-weight:600; cursor:pointer; }
  button.act:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button.act.primary { background:var(--accent); border-color:var(--accent); color:#08131f; }
  button.act.wide { grid-column: 1 / -1; }
  button.act:disabled { opacity:.45; cursor:not-allowed; }
  /* A disabled PRIMARY button must not just fade: dark text at 45% on the
     accent fill is unreadable, and this is the button the operator looks at
     for the whole time the guard is holding. Grey it properly instead. */
  button.act.primary:disabled { background:var(--panel-2); border-color:var(--line);
                                color:var(--fg-dim); opacity:1; }

  /* The click guard, made visible. A greyed button with no reason next to it
     reads as a broken page. */
  .gate { margin-top:10px; border-radius:5px; padding:8px 10px; font:11px var(--mono);
          background:var(--panel-2); border:1px solid var(--line); color:var(--fg-dim); }
  .gate.ready { color:var(--ok); }
  .gate.busy { color:var(--accent); border-color:#28466b; background:#16202c; }
  .gate.hold { color:var(--warn); border-color:#4b3f16; background:#2a2413; }

  /* min-height so a stream that is not running still leaves room for the
     diagnostic overlay to be read, instead of collapsing to a sliver. */
  .stagewrap { position:relative; background:#000; border:1px solid var(--line);
               border-radius:6px; overflow:hidden; max-width:700px; margin:0 auto;
               min-height:240px; }
  .stagewrap canvas, .stagewrap img { display:block; width:100%; image-rendering:pixelated; }
  .stagetag { position:absolute; top:8px; left:8px; font:10px var(--mono);
              background:rgba(0,0,0,.65); color:var(--fg-dim); padding:3px 7px; border-radius:3px; }
  .rec { position:absolute; top:8px; right:8px; font:10px var(--mono);
         background:rgba(0,0,0,.65); padding:3px 8px; border-radius:3px; color:var(--danger); }
  .rec .dot { background:var(--danger); }
  .diag { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          text-align:center; padding:20px; font:12px var(--mono); color:var(--danger);
          background:#1a1113; }

  .pill { display:flex; margin-top:12px; border:1px solid var(--line); border-radius:6px;
          overflow:hidden; background:var(--panel); font:12px var(--mono); max-width:700px;
          margin-left:auto; margin-right:auto; }
  .pill .half { flex:1; padding:9px 12px; }
  .pill .half + .half { border-left:1px solid var(--line); }
  .pill .k { font:10px var(--sans); text-transform:uppercase; letter-spacing:.08em;
             color:var(--fg-faint); display:block; margin-bottom:4px; }
  .pill .v { font-size:15px; }
  .pill .sub { color:var(--fg-dim); font-size:11px; }
  .pill .delta { padding:9px 12px; border-left:1px solid var(--line); display:flex; align-items:center; }
  .pill.state-ok .delta { color:var(--ok); }
  .pill.state-warn .delta { color:var(--warn); }
  .pill.state-bad .delta { color:var(--danger); }
  .pill.state-idle .delta { color:var(--fg-faint); }

  .warn-box { margin:12px auto 0; border-radius:6px; border:1px solid var(--line);
              overflow:hidden; max-width:700px; }
  .warn-item { display:flex; gap:10px; padding:9px 12px; font-size:12.5px;
               border-bottom:1px solid var(--line-soft); background:var(--panel); }
  .warn-item:last-child { border-bottom:0; }
  .warn-item .icon { font:11px var(--mono); font-weight:700; flex:none; width:14px; }
  .warn-item.ok .icon { color:var(--ok); }
  .warn-item.warn .icon { color:var(--warn); }
  .warn-item.bad .icon { color:var(--danger); }
  .warn-item.info .icon { color:var(--fg-faint); }
  .warn-item.warn { background:#2a2413; }
  .warn-item.bad { background:#2d1817; }
  .warn-item .est { color:var(--fg-faint); font:11px var(--mono); }

  .res-line { text-align:center; font:11px var(--mono); color:var(--fg-dim); padding:2px 0 10px; }
  .res-line b { color:var(--fg); font-weight:400; }
  .ch { margin-bottom:11px; }
  .ch:last-child { margin-bottom:0; }
  .ch .plotrow { display:flex; gap:5px; }
  .ch .chlab { flex:none; width:13px; display:flex; align-items:center; justify-content:center;
               font:10px var(--mono); color:var(--fg-dim);
               writing-mode:vertical-rl; transform:rotate(180deg); }
  .ch canvas { display:block; flex:1; min-width:0; width:100%; height:58px;
               background:#0d0f12; border:1px solid var(--line); border-radius:3px; }
  .ch .axis { display:flex; justify-content:space-between; margin-left:18px;
              font:9px var(--mono); color:var(--fg-faint); padding-top:2px; }
  .ch .st { display:grid; grid-template-columns:repeat(4,1fr); gap:1px 4px;
            margin-left:18px; margin-top:3px; font:10px var(--mono); color:var(--fg-faint); }
  .ch .st b { color:var(--fg); font-weight:400; }
  .cmp-hist .ch .st { font-size:9px; }
  .cmp-hist .ch canvas { height:46px; }

  .stats { font:11.5px var(--mono); }
  .stats div { display:flex; justify-content:space-between; gap:10px; padding:3px 0; }
  .stats .k { color:var(--fg-faint); flex:none; }
  .stats div > span:last-child { text-align:right; word-break:break-word; }
  .stats .bad { color:var(--danger); }

  .gallery { border-top:1px solid var(--line); background:var(--panel); padding:12px 16px; }
  .galhead { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .galhead h2 { margin:0; font-size:11px; font-weight:600; text-transform:uppercase;
                letter-spacing:.08em; color:var(--fg-dim); }
  .galhead .hint { font:11px var(--mono); color:var(--fg-faint); }
  .strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .thumb { flex:none; width:158px; border:2px solid var(--line); border-radius:5px;
           overflow:hidden; cursor:pointer; background:#000; position:relative; }
  .thumb.sel { border-color:var(--accent); }
  .thumb canvas { display:block; width:100%; height:100px; object-fit:cover; }
  .thumb .meta { font:10px var(--mono); color:var(--fg-dim); padding:5px 6px;
                 background:var(--panel-2); display:flex; justify-content:space-between; }
  .thumb .badge { position:absolute; top:5px; left:5px; font:9px var(--mono);
                  background:rgba(0,0,0,.72); padding:2px 5px; border-radius:3px; color:var(--fg); }

  .compare { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cmp-card { border:1px solid var(--line); border-radius:6px; background:var(--panel); overflow:hidden; }
  .cmp-card canvas.shot { display:block; width:100%; background:#000; }
  .cmp-card .cmp-hist { padding:8px; }
  .cmp-card table { width:100%; border-collapse:collapse; font:11px var(--mono); }
  .cmp-card td { padding:3px 8px; border-top:1px solid var(--line-soft); }
  .cmp-card td:first-child { color:var(--fg-faint); }
  .cmp-card td:last-child { text-align:right; }
  .cmp-card td.diff { color:var(--accent); }
  .hidden { display:none !important; }
  .foot { padding:12px 16px; border-top:1px solid var(--line);
          font:11px var(--mono); color:var(--fg-faint); line-height:1.7; }
</style>
</head>
<body>

<header>
  <h1>Camera Bench <span id="hostlabel"></span></h1>
  <div class="chain">
    <span class="node">Camera</span><span class="hop">&rarr;</span>
    <span class="node">Light</span><span class="hop">&rarr;</span>
    <span class="node">Telemetry</span>
  </div>
  <div class="spacer"></div>
  <div class="heartbeat" id="beat"><span class="dot"></span>connecting&hellip;</div>
</header>

<div class="grid" id="mainGrid">
  <div class="col">
    <div class="panel">
      <h2>Camera</h2>
      <div class="body">
        <div class="field">
          <label>Resolution <span class="val" id="resval"></span></label>
          <div class="seg" id="segres">
            <button data-res="1" aria-pressed="true">QVGA</button>
            <button data-res="2" aria-pressed="false">VGA</button>
            <button data-res="3" aria-pressed="false">HD</button>
          </div>
        </div>
        <div class="field">
          <label>Pixel format <span class="val" id="pfval"></span></label>
          <div class="seg" id="segpf">
            <button data-pf="color" aria-pressed="true">Color</button>
            <button data-pf="mono" aria-pressed="false">Greyscale</button>
          </div>
          <div class="seghint" id="seghint"></div>
        </div>
        <div class="field">
          <label>JPEG quality <span class="val" id="qval">50</span></label>
          <input type="range" id="q" min="10" max="95" step="5" value="50">
        </div>
        <div class="field">
          <label>Stream rate <span class="val" id="fpsval">15.0 fps</span></label>
          <input type="range" id="fps" min="1" max="30" step="1" value="15">
        </div>
        <div class="row2">
          <div class="field"><label>Rate cap</label>
            <input type="number" id="mbps" value="2.0" step="0.1" min="0"></div>
          <div class="field"><label>Duration</label>
            <input type="number" id="secs" value="60" step="10" min="1"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Actions</h2>
      <div class="body">
        <div class="btns">
          <button class="act wide primary" id="btnCapture">Capture still</button>
          <button class="act" id="btnStream">Start stream</button>
          <button class="act" id="btnStop" title="Never gated — the escape hatch">Stop</button>
        </div>
        <div class="gate" id="gate">&nbsp;</div>
      </div>
    </div>

    <div class="panel">
      <h2>Light</h2>
      <div class="body">
        <div class="field">
          <label>Level <span class="val" id="lightval">0</span></label>
          <input type="range" id="light" min="0" max="100" step="5" value="0">
        </div>
        <div class="field">
          <label>Strobe <span class="val">on / off / count</span></label>
          <div class="row3">
            <input type="number" id="son" value="200"><input type="number" id="soff" value="200">
            <input type="number" id="scount" value="5">
          </div>
        </div>
        <div class="btns"><button class="act wide" id="btnStrobe">Strobe</button></div>
      </div>
    </div>

    <div class="panel">
      <h2>Last replies</h2>
      <div class="body stats" id="replies"></div>
    </div>
  </div>

  <div class="col">
    <div id="liveView">
      <div class="stagewrap">
        <img id="stage" alt="live stream">
        <div class="stagetag" id="stagetag">/stream</div>
        <div class="rec hidden" id="rec"><span class="dot"></span>STREAMING</div>
        <div class="diag hidden" id="diag"></div>
      </div>
      <div class="pill state-idle" id="pill">
        <div class="half"><span class="k">Commanded</span>
          <span class="v" id="cmdFps">&mdash;</span> <span class="sub" id="cmdRate"></span></div>
        <div class="half"><span class="k">Actual (receiver ledger)</span>
          <span class="v" id="actFps">&mdash;</span> <span class="sub" id="actRate"></span></div>
        <div class="delta" id="pillDelta">idle</div>
      </div>
      <div class="warn-box" id="warnBox"></div>
    </div>
  </div>

  <div class="col" id="rightCol">
    <div class="panel">
      <h2>Levels</h2>
      <div class="body stats">
        <div><span class="k">RGB + luma histograms</span><span>S18 bite C2</span></div>
      </div>
    </div>
    <div class="panel"><h2>Receiver ledger</h2><div class="body stats" id="ledger"></div></div>
    <div class="panel"><h2>Model constants</h2><div class="body stats" id="consts"></div></div>
  </div>
</div>

<div class="foot" id="foot"></div>

<script>
/* =====================================================================
   S18 bite C1. Every number below is either measured (and cited) or read
   from the control socket. Nothing on this page is simulated.
   ===================================================================== */

// ---- measured constants (docs/DESIGN.md §S0 reference-scene table) ----
const K = {
  RELAY_CEILING: 5.262e6,   // bps sustained WITH capture live (S17 bite 0, 600 s)
  CHUNK_MAX: 1400, CHUNK_HDR: 10, RPMSG_PAYLOAD: 492,   // REV-28
  // S17 bite 0 held 15.00 fps in-bridge at QVGA color reef q50, where pure
  // encode says 1000/19.7 = 50.8 fps. Capture + encode + chunk + rpmsg all
  // serialize on the one HP core. ONE measured point -> everything off
  // QVGA-color is an EXTRAPOLATION until S18 bite B2 measures the matrix.
  BRIDGE_DERATE: 15.0 / (1000 / 19.7),
  VIDEO_MIN_FPS: 1.5,       // below this a mode is offered for stills only
};

// The sensor letterboxes to 16:10 (QVGA = 320x200, not 320x240).
// QQVGA/SVGA/WXGA return "Sensor control failed" on sensor 0x7936;
// nothing above HD was ever tested, so nothing above HD is offered.
const RES = {
  1: { name: "QVGA", cmd: "qvga", w: 320,  h: 200 },
  2: { name: "VGA",  cmd: "vga",  w: 640,  h: 400 },
  3: { name: "HD",   cmd: "hd",   w: 1280, h: 800 },
};
const RES_BY_CMD = { qvga: 1, vga: 2, hd: 3 };
// Reef reference P7071008 @ q50: [bytes/frame, encode ms] measured per mode.
const MEAS = {
  1: { color: [9198, 19.7],   mono: [7536, 8.3]    },
  2: { color: [29148, 76.7],  mono: [23831, 31.1]  },
  3: { color: [93253, 299.2], mono: [75324, 117.6] },
};

const S = { res: 1, pf: "color", q: 50, fps: 15, mbps: 2.0, secs: 60, light: 0,
            note: null };
let CFG = { stream_port: 8080, settle: 8.0 };
let GATE = { mode: "idle", busy: false, settle_in: 0, res: null, pf: null,
             reason: "", retry_in: 0, stream_left: 0 };

// ---- model -----------------------------------------------------------
const qFactor = q => Math.pow(1.95, (q - 50) / 22);

function modelFor(res, pf, q, fps) {
  const [b50, enc50] = MEAS[res][pf];
  const bytes = b50 * qFactor(q);
  const encMs = enc50 * (1 + (q - 50) / 400);
  const encCeil = 1000 / encMs;
  const bridgeCeil = encCeil * K.BRIDGE_DERATE;
  const chunks = Math.ceil(bytes / (K.CHUNK_MAX - K.CHUNK_HDR));
  const wireBytes = bytes + chunks * K.CHUNK_HDR;
  const effFps = Math.min(fps, bridgeCeil);
  return { bytes, encMs, encCeil, bridgeCeil, chunks, wireBytes, effFps,
           bps: wireBytes * 8 * effFps, bpsAtCmd: wireBytes * 8 * fps,
           videoOk: bridgeCeil >= K.VIDEO_MIN_FPS };
}
const model = () => modelFor(S.res, S.pf, S.q, S.fps);

// ---- warnings + gating -----------------------------------------------
// EXTRAPOLATED, and labelled that way everywhere: the derate comes from one
// measured point. S18 bite B2's 9-row matrix replaces these with measured
// numbers, at which point the word can change.
const EST = '<span class="est">extrapolated</span>';

function renderWarnings() {
  const m = model(), r = RES[S.res], out = [];
  if (S.note) out.push(`<div class="warn-item warn"><span class="icon">&darr;</span><span>${S.note}</span></div>`);
  out.push(`<div class="warn-item info"><span class="icon">&asymp;</span><span>
      <b>${r.name} ${r.w}&times;${r.h} ${S.pf} q${S.q}</b> &rarr; est. ${(m.bytes/1024).toFixed(1)} KB/frame,
      ${m.chunks} chunk${m.chunks>1?"s":""}, encode &asymp; ${m.encMs.toFixed(0)} ms
      <span class="est">(pure encode ${m.encCeil.toFixed(1)} fps &rarr; in-bridge &asymp; ${m.bridgeCeil.toFixed(1)} fps, extrapolated)</span></span></div>`);

  if (!m.videoOk) {
    out.push(`<div class="warn-item info"><span class="icon">&#9673;</span><span>
        <b>Stills only.</b> This mode streams at &asymp; ${m.bridgeCeil.toFixed(1)} fps &mdash; below the
        ${K.VIDEO_MIN_FPS} fps floor for a usable live view.
        ${modelFor(S.res,"mono",S.q,S.fps).videoOk
          ? `Greyscale at this resolution does stream (&asymp; ${modelFor(S.res,"mono",S.q,S.fps).bridgeCeil.toFixed(1)} fps).` : ""}
        ${EST}</span></div>`);
  } else if (m.bpsAtCmd > K.RELAY_CEILING) {
    out.push(`<div class="warn-item bad"><span class="icon">&times;</span><span>
        <b>Exceeds transport.</b> ${S.fps} fps needs &asymp; ${(m.bpsAtCmd/1e6).toFixed(2)} Mbps &mdash; over the
        measured ${(K.RELAY_CEILING/1e6).toFixed(2)} Mbps relay ceiling. ${EST}</span></div>`);
  } else if (m.bridgeCeil < S.fps) {
    out.push(`<div class="warn-item warn"><span class="icon">!</span><span>
        <b>fps will cap at &asymp; ${m.bridgeCeil.toFixed(1)}</b> &mdash; encoder-bound, not transport.
        You asked for ${S.fps}. ${EST}</span></div>`);
  } else {
    out.push(`<div class="warn-item ok"><span class="icon">&check;</span><span>
        Fits: est. ${(m.bps/1e6).toFixed(2)} Mbps at ${m.effFps.toFixed(1)} fps
        (${((m.bps/K.RELAY_CEILING)*100).toFixed(0)}% of relay ceiling). ${EST}</span></div>`);
  }
  if (m.videoOk && S.mbps > 0 && m.bps > S.mbps*1e6) {
    out.push(`<div class="warn-item warn"><span class="icon">!</span><span>
        Rate cap <b>${S.mbps.toFixed(1)} Mbps</b> is below the estimate &mdash; the bridge will skip
        fps slots to stay under budget.</span></div>`);
  }
  document.getElementById("warnBox").innerHTML = out.join("");

  document.getElementById("consts").innerHTML = `
    <div><span class="k">frame (est)</span><span>${(m.bytes/1024).toFixed(1)} KB</span></div>
    <div><span class="k">encode (est)</span><span>${m.encMs.toFixed(1)} ms</span></div>
    <div><span class="k">pure-encode fps</span><span>${m.encCeil.toFixed(1)}</span></div>
    <div><span class="k">in-bridge fps</span><span>${m.bridgeCeil.toFixed(1)}</span></div>
    <div><span class="k">chunks/frame</span><span>${m.chunks}</span></div>
    <div><span class="k">rpmsg msgs/frame</span><span>${m.chunks*Math.ceil(K.CHUNK_MAX/K.RPMSG_PAYLOAD)}</span></div>
    <div><span class="k">relay ceiling</span><span>${(K.RELAY_CEILING/1e6).toFixed(3)} Mbps</span></div>
    <div><span class="k">fps predictions</span><span>EXTRAPOLATED from one<br>measured point &mdash; QVGA<br>colour reef q50 = 15.00 fps<br>(S17 bite 0). S18 bite B2<br>replaces them.</span></div>`;
}

// A mode is video-capable when its in-bridge estimate clears the floor.
// HD color (~1.0 fps) does not; HD GREYSCALE (~2.5 fps) does -- so entering
// video mode on HD switches the pixel format rather than throwing the
// resolution away.
function applyVideoGating(videoMode) {
  const hint = document.getElementById("seghint");
  const hdMono = modelFor(3, "mono", S.q, S.fps);
  hint.textContent = videoMode
    ? "video: HD is greyscale-only"
    : `HD colour is stills-only · HD greyscale streams ≈ ${hdMono.bridgeCeil.toFixed(1)} fps`;
  hint.classList.toggle("active", videoMode);

  if (videoMode && !model().videoOk) {
    const was = `${RES[S.res].name} ${S.pf}`;
    if (modelFor(S.res, "mono", S.q, S.fps).videoOk) {
      setPf("mono");
      S.note = `<b>${was} is stills-only</b> &mdash; switched to greyscale at the same
                resolution (&asymp; ${model().bridgeCeil.toFixed(1)} fps), rather than dropping resolution.`;
    } else {
      for (let res = S.res - 1; res >= 1; res--) {
        if (modelFor(res, S.pf, S.q, S.fps).videoOk) {
          setRes(res);
          S.note = `<b>${was} is stills-only</b> &mdash; dropped to ${RES[res].name}.`;
          break;
        }
      }
    }
    return true;
  }
  return false;
}

function setRes(res) {
  S.res = res;
  document.querySelectorAll("#segres button").forEach(b =>
    b.setAttribute("aria-pressed", +b.dataset.res === res));
  document.getElementById("resval").textContent = `${RES[res].name} ${RES[res].w}×${RES[res].h}`;
}
function setPf(pf) {
  S.pf = pf;
  document.querySelectorAll("#segpf button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.pf === pf));
  document.getElementById("pfval").textContent = pf === "mono" ? "greyscale" : "color";
}

// ---- the click guard, mirrored from the server -----------------------
// The server enforces this; the page only makes it visible. A reload or a
// second tab cannot get past it, which is the whole point (SPEC: a sensor
// re-init too soon after a capture wedges the camera for the bridge's life).
function wouldReinit() {
  return RES[S.res].cmd !== GATE.res || S.pf !== GATE.pf;
}

function renderGate() {
  const el = document.getElementById("gate");
  const cap = document.getElementById("btnCapture");
  const str = document.getElementById("btnStream");
  const held = GATE.busy || (GATE.settle_in > 0 && wouldReinit());
  cap.disabled = held;
  str.disabled = held || GATE.mode === "stream";
  document.getElementById("rec").classList.toggle("hidden", GATE.mode !== "stream");

  el.className = "gate " + (GATE.busy ? "busy" : held ? "hold" : "ready");
  if (GATE.mode === "capture") {
    el.textContent = "capture in flight — waiting for the frame to land";
  } else if (GATE.mode === "stream") {
    el.textContent = `streaming — ${GATE.stream_left.toFixed(0)} s left (Stop is always available)`;
  } else if (held) {
    el.textContent = `sensor settle ${GATE.settle_in.toFixed(1)} s — `
      + `${RES[S.res].name} ${S.pf} needs a re-init, and one too soon wedges the camera`;
  } else if (GATE.settle_in > 0) {
    el.textContent = `ready · ${RES[S.res].name} ${S.pf} repeats need no re-init `
      + `(settle ${GATE.settle_in.toFixed(1)} s applies to a mode change)`;
  } else {
    el.textContent = "ready";
  }
}

// ---- live data -------------------------------------------------------
const lastReplies = { CAM_REPLY: "—", LIGHT_REPLY: "—", SAVE: "—" };
function renderReplies() {
  document.getElementById("replies").innerHTML = Object.entries(lastReplies)
    .map(([k,v]) => `<div><span class="k">${k}</span><span>${v}</span></div>`).join("");
}

function beat(up, text) {
  const el = document.getElementById("beat");
  el.className = "heartbeat" + (up ? "" : " down");
  el.innerHTML = `<span class="dot"></span>${text}`;
}

function renderStatus(st) {
  const cam = st.cam_reply || {}, li = st.light_reply || {},
        led = st.ledger || {}, sv = st.save || {};
  lastReplies.CAM_REPLY = cam.seen
    ? `ok=${cam.ok} mode=${cam.mode} ${cam.res} ${cam.pf} pub_ok=${cam.pub_ok} pub_errs=${cam.pub_errs}`
    : "none yet";
  lastReplies.LIGHT_REPLY = li.seen
    ? `ok=${li.ok} level=${li.level} strobing=${li.strobing}` : "none yet";
  lastReplies.SAVE = `${sv.state} · ${sv.last_file || "—"} `
    + `${sv.last_bytes ? "(" + sv.last_bytes + " B)" : ""} · ${sv.saved} saved, ${sv.errors} err`;
  renderReplies();

  const bad = n => n ? ' class="bad"' : "";
  document.getElementById("ledger").innerHTML = `
    <div><span class="k">frames_ok</span><span>${led.frames_ok}</span></div>
    <div><span class="k">dropped</span><span${bad(led.dropped)}>${led.dropped}</span></div>
    <div><span class="k">chunk gaps</span><span${bad(led.gaps)}>${led.gaps}</span></div>
    <div><span class="k">hdr_errs</span><span${bad(led.hdr_errs)}>${led.hdr_errs}</span></div>
    <div><span class="k">q_drops</span><span${bad(led.q_drops)}>${led.q_drops}</span></div>
    <div><span class="k">ingest_ok</span><span>${led.ingest_ok}</span></div>
    <div><span class="k">ingest_fail</span><span${bad(led.ingest_fail)}>${led.ingest_fail}</span></div>
    <div><span class="k">fps / kBps</span><span>${led.fps} / ${led.kBps}</span></div>
    <div><span class="k">ipc</span><span>${led.ipc}</span></div>
    <div><span class="k">free disk</span><span>${sv.free_mb} MB</span></div>`;

  // The pill: commanded is what the NODE says it was asked for, not what the
  // sliders happen to read now; actual is the receiver ledger.
  const p = st.params || {}, streaming = GATE.mode === "stream";
  const actFps = Number(led.fps) || 0, actBps = (Number(led.kBps) || 0) * 8000;
  document.getElementById("cmdFps").textContent =
    streaming && p.fps ? p.fps.toFixed(1) + " fps" : "—";
  document.getElementById("cmdRate").textContent =
    streaming ? (p.mbps > 0 ? `cap ${p.mbps.toFixed(2)} Mbps` : "uncapped") : (p.last_cmd || "");
  document.getElementById("actFps").textContent = actFps.toFixed(1) + " fps";
  document.getElementById("actRate").textContent = (actBps/1e6).toFixed(2) + " Mbps";
  const pill = document.getElementById("pill");
  if (!streaming || !p.fps) {
    pill.className = "pill state-idle";
    document.getElementById("pillDelta").textContent = "idle";
  } else {
    const ratio = actFps / p.fps;
    pill.className = "pill " + (ratio > .93 ? "state-ok" : ratio > .6 ? "state-warn" : "state-bad");
    document.getElementById("pillDelta").textContent =
      ratio > .93 ? "on target" : `${((1-ratio)*100).toFixed(0)}% under · encoder-bound (est.)`;
  }
}

// ---- polling ---------------------------------------------------------
// 1 Hz idle, 2 Hz while the gate is holding, so a countdown does not crawl.
async function poll() {
  let next = 1000;
  try {
    const r = await fetch("/api/status");
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.err || ("HTTP " + r.status));
    GATE = j.gate;
    renderStatus(j.status);
    renderGate();
    beat(true, `control socket up · node ${j.status.node} · ledger 1 Hz`);
    if (GATE.busy || GATE.settle_in > 0) next = 500;
  } catch (e) {
    beat(false, "control socket: " + e.message);
    document.getElementById("gate").className = "gate hold";
    document.getElementById("gate").textContent = "no status — commands will fail: " + e.message;
    next = 2000;
  }
  setTimeout(poll, next);
}

async function post(path, body) {
  try {
    const r = await fetch("/api/" + path, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if (j.gate) { GATE = j.gate; renderGate(); }
    if (!r.ok || !j.ok) {
      lastReplies.CAM_REPLY = `REFUSED (${r.status}): ${j.err || "unknown"}`;
      renderReplies();
    }
    return j;
  } catch (e) {
    lastReplies.CAM_REPLY = "request failed: " + e.message;
    renderReplies();
    return { ok: false };
  }
}

const camBody = () => ({ q: S.q, res: RES[S.res].cmd, pf: S.pf });

// ---- wiring ----------------------------------------------------------
document.getElementById("segres").onclick = e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  S.note = null; setRes(+b.dataset.res);
  applyVideoGating(GATE.mode === "stream"); renderWarnings(); renderGate();
};
document.getElementById("segpf").onclick = e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  S.note = null; setPf(b.dataset.pf);
  renderWarnings(); renderGate();
};
document.getElementById("q").oninput = e => {
  S.q = +e.target.value;
  document.getElementById("qval").textContent = S.q;
  renderWarnings();
};
document.getElementById("fps").oninput = e => {
  S.fps = +e.target.value;
  document.getElementById("fpsval").textContent = S.fps.toFixed(1) + " fps";
  renderWarnings();
};
document.getElementById("mbps").oninput = e => { S.mbps = +e.target.value; renderWarnings(); };
document.getElementById("secs").oninput = e => { S.secs = +e.target.value; };
document.getElementById("light").oninput = e => {
  S.light = +e.target.value;
  document.getElementById("lightval").textContent = S.light;
};
document.getElementById("light").onchange = () => post("light", { level: S.light });
document.getElementById("btnStrobe").onclick = () => post("strobe", {
  on_ms: +document.getElementById("son").value,
  off_ms: +document.getElementById("soff").value,
  count: +document.getElementById("scount").value,
});

document.getElementById("btnCapture").onclick = async e => {
  e.target.disabled = true;            // no double-fire while the POST is open
  await post("capture", camBody());
};
document.getElementById("btnStream").onclick = async e => {
  e.target.disabled = true;
  // Switch to a video-capable mode BEFORE sending, exactly as the mockup
  // does: HD colour becomes HD greyscale rather than dropping resolution.
  if (applyVideoGating(true)) renderWarnings();
  await post("stream", Object.assign(camBody(),
    { mbps: S.mbps, fps: S.fps, secs: S.secs }));
};
document.getElementById("btnStop").onclick = async () => {
  await post("stop", {});
  applyVideoGating(false); renderWarnings();
};

// ---- boot ------------------------------------------------------------
(async function boot() {
  try { CFG = await (await fetch("/api/config")).json(); } catch (e) { /* defaults */ }
  const streamUrl = `http://${location.hostname}:${CFG.stream_port}/stream`;
  const img = document.getElementById("stage");
  img.onerror = () => {
    document.getElementById("diag").classList.remove("hidden");
    document.getElementById("diag").textContent =
      `no stream from ${streamUrl} — is t1l-stream-server running?`;
  };
  img.onload = () => document.getElementById("diag").classList.add("hidden");
  img.src = streamUrl;
  document.getElementById("stagetag").textContent = `${location.hostname}:${CFG.stream_port}/stream`;
  document.getElementById("hostlabel").textContent = `· ${location.host}`;

  setRes(1); setPf("color");
  applyVideoGating(false);
  renderWarnings(); renderReplies(); renderGate();
  document.getElementById("foot").innerHTML =
    `S18 bite C1 · controls drive <b>/run/bm/bench.sock</b> (bite B) · live view is the frozen S3 server on :${CFG.stream_port}
     <br>fps and bandwidth predictions are <b>EXTRAPOLATED</b> from one measured point (QVGA colour reef q50 = 15.00 fps, S17 bite 0) — S18 bite B2 replaces them with a measured matrix
     <br>capture/stream are held for <b>${CFG.settle} s</b> after a capture when the next command changes resolution or pixel format: a sensor re-init too soon wedges the camera until the bridge restarts (SPEC §Open questions, bite B2 fixes it underneath)
     <br>gallery, side-by-side compare and RGB+luma histograms are bite C2`;
  poll();
})();
</script>
