# s28_stack_compare.toml -- S28 bite 2: one-click frame-stacking compare.
#
# Click -> the wrapper (pi/s28/s28_compare_run.py) serves a page on :8093
# immediately (so the card goes LIVE), captures a locked RGB565 burst
# from BOTH boards (AE3 then N6), runs the stacking merges, and writes
# the report into that page: per board, single vs mean/median/sigma-clip,
# the sqrt(N) noise ladder, and a FLICKER CHECK that says whether the
# light was steady enough to trust the result (ALIASED = a wobbling
# source stacking cannot remove -> use a constant/DC light).
#
# RGB565 = the deployed path AND the only format both boards share (the
# N6's stock firmware cannot emit BAYER). It is also the AE3's boot mode,
# so the cfg is a no-op and never triggers the mode-switch wedge. Aim
# both boards at the same STATIC scene under STEADY light. Stop = shut the
# server (boards are released after capture, not held while serving).

name = "s28-stack-compare"
title = "S28 frame-stacking compare (AE3 + N6)"
summary = "One click: capture a locked RGB565 burst from BOTH boards and show, per board, single vs mean/median/sigma-clip side by side, with the sqrt(N) noise ladder and a flicker check (is the light steady?). Aim both boards at the same static scene under constant light. Report at :8093; artifacts under ~/s28_runs/. From sprint S28 bite 2."
opens = ":8093"

[params]
frames = ["8", "16", "32"]
framesize = ["VGA", "HD"]

[[boards]]
label = "AE3"
by_id = "usb-OpenMV_OpenMV_Camera_0829c14000000000-if00"

[[boards]]
label = "N6"
by_id = "usb-MicroPython_Pyboard_Virtual_Comm_Port_in_FS_Mode_020023000450433547373200-if00"

[run]
argv = ["python3", "-u", "pi/s28/s28_compare_run.py",
        "--serve-port", "8093"]
cwd = "."
stop_grace = 30

[health]
http = "http://127.0.0.1:8093/"
