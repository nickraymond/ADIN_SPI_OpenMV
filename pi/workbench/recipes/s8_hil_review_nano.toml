# s8_hil_review_nano.toml -- S8 bite E5: one-click closed-loop HIL review, NANO.
#
# The whole review session from one card: the wrapper
# (pi/hil/hil_review_run.py) starts the playback screen, waits for :8091,
# checks hil-lcd.service, then runs the closed-loop harness in review mode
# against BOTH boards. Stop tears down harness-FIRST (its clean path quits
# the boards, releases the serial ports and scores what was collected),
# then playback -- the wrapper owns that order because the runner's group
# signal cannot. stop_grace covers a mid-run abort that still has scoring
# and overlays to write.
#
# The tiny twin is s8_hil_review_tiny.toml -- picking a card IS picking
# the model (Nick's option A, 2026-08-25). Manual ssh fallback: the
# hil-review guide card.

name = "s8-hil-review-nano"
title = "HIL review — closed loop (nano)"
summary = "One click: playback screen + closed-loop harness in review mode, nano-tiled, both boards, 30 px GT floor. Review detections at :8092 (Pause/Next/Auto/Abort); Stop scores what was collected and releases the ports. Artifacts land under ~/hil_runs/. From sprint S8 bite E5."
opens = ":8092"
services = ["hil-lcd.service"]

[[boards]]
label = "AE3"
by_id = "usb-OpenMV_OpenMV_Camera_0829c14000000000-if00"

[[boards]]
label = "N6"
by_id = "usb-MicroPython_Pyboard_Virtual_Comm_Port_in_FS_Mode_020023000450433547373200-if00"

[run]
argv = ["python3", "-u", "pi/hil/hil_review_run.py", "--phases", "nano-tiled"]
cwd = "."
stop_grace = 40

[health]
http = "http://127.0.0.1:8092/"
